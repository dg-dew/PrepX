<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Profile · CareerPrepX</title>
<meta name="description" content="View and edit your CareerPrepX profile." />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  .profile-header { display:flex; align-items:center; gap:18px; }
  .avatar-lg { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--accent)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; font-family:'Space Grotesk',sans-serif; flex-shrink:0; }
  .field-group { margin-top:18px; }
  .field-label { font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-muted); margin-bottom:6px; display:block; }
  .field-input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:inherit; font-size:14px; }
  .field-input:disabled { opacity:0.6; cursor:not-allowed; }
  .field-hint { font-size:12px; color:var(--text-muted); margin-top:6px; }
  .status-msg { margin-top:14px; font-size:13px; padding:10px 12px; border-radius:10px; display:none; }
  .status-msg.show { display:block; }
  .status-msg.err { background:color-mix(in oklab, var(--danger) 14%, transparent); color:var(--danger); border:1px solid color-mix(in oklab, var(--danger) 40%, transparent); }
  .status-msg.ok { background:color-mix(in oklab, var(--success) 14%, transparent); color:var(--success); border:1px solid color-mix(in oklab, var(--success) 40%, transparent); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">C</span> Career<span style="color:var(--accent)">PrepX</span></a>
    <nav class="side-nav">
      <a href="dashboard.html">◆ Dashboard</a>
      <a href="aptitude.html">⚡ Aptitude</a>
      <a href="resume.html">📄 Resume ATS</a>
      <a href="coding.html">⌨ Coding Arena</a>
      <a href="interview.html">🎤 Mock Interview</a>
      <a href="profile.html" class="active">👤 Profile</a>
      <a href="settings.html">⚙ Settings</a>
      <a href="index.html">← Back to site</a>
      <a href="#" onclick="signOutAndRedirect(); return false;">⎋ Sign Out</a>
    </nav>
    <div style="margin-top:20px;"><button class="theme-toggle" data-theme-toggle style="width:100%;justify-content:center;"><span data-theme-label>☀ Light</span></button></div>
  </aside>
 
  <main class="main">
    <div class="page-head">
      <div>
        <h1>My Profile</h1>
        <p>Your CareerPrepX account details.</p>
      </div>
    </div>
 
    <div class="grid" style="grid-template-columns:1fr; max-width:560px; gap:20px;">
      <div class="panel">
        <div class="profile-header">
          <div class="avatar-lg" id="avatarInitial">U</div>
          <div>
            <div style="font-size:20px; font-weight:700;" id="profileNameDisplay">Loading…</div>
            <div class="muted small" id="profileEmailDisplay">—</div>
          </div>
        </div>
 
        <form id="profileForm">
          <div class="field-group">
            <label class="field-label" for="fullNameInput">Full Name</label>
            <input type="text" id="fullNameInput" class="field-input" placeholder="Your full name" />
          </div>
 
          <div class="field-group">
            <label class="field-label" for="emailInput">Email</label>
            <input type="email" id="emailInput" class="field-input" disabled />
            <div class="field-hint">Email is tied to your login and can't be changed here.</div>
          </div>
 
          <div class="field-group">
            <label class="field-label">Member Since</label>
            <input type="text" id="memberSinceInput" class="field-input" disabled />
          </div>
 
          <div class="field-group" style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
          </div>
 
          <div class="status-msg" id="profileStatusMsg"></div>
        </form>
      </div>
    </div>
  </main>
</div>
 
<script src="script.js"></script>
<script>
let currentUser = null;
 
document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  await loadProfile();
});
 
const profileStatusMsg = document.getElementById('profileStatusMsg');
function showProfileStatus(text, type) {
  profileStatusMsg.textContent = text;
  profileStatusMsg.className = 'status-msg show ' + type;
}
 
async function loadProfile() {
  const profile = await getCurrentProfile();
  const fullName = profile?.full_name || '';
  const email = currentUser.email || '';
  const memberSince = currentUser.created_at
    ? new Date(currentUser.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })
    : '—';
 
  document.getElementById('fullNameInput').value = fullName;
  document.getElementById('emailInput').value = email;
  document.getElementById('memberSinceInput').value = memberSince;
 
  const displayName = fullName || email.split('@')[0] || 'User';
  document.getElementById('profileNameDisplay').textContent = displayName;
  document.getElementById('profileEmailDisplay').textContent = email;
  document.getElementById('avatarInitial').textContent = displayName.charAt(0).toUpperCase();
}
 
document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById('saveProfileBtn');
  const fullName = document.getElementById('fullNameInput').value.trim();
 
  if (!fullName) {
    showProfileStatus('Full name cannot be empty.', 'err');
    return;
  }
 
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
 
  try {
    const { error } = await supabaseClient
      .from('profiles')
      .update({ full_name: fullName })
      .eq('id', currentUser.id);
 
    if (error) {
      showProfileStatus('Could not save: ' + error.message, 'err');
    } else {
      showProfileStatus('Profile updated.', 'ok');
      document.getElementById('profileNameDisplay').textContent = fullName;
      document.getElementById('avatarInitial').textContent = fullName.charAt(0).toUpperCase();
    }
  } catch (err) {
    showProfileStatus('Something went wrong: ' + err.message, 'err');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Changes';
  }
});
</script>
</body>
</html>
